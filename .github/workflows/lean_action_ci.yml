name: Lean Action CI

on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
    branches:
      - dev
  workflow_dispatch:

# The jobs only build and test fixtures inside the runner's own checkout; the `gh` calls
# made by lean-action read the public Mathlib cache and the public list of Lean releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        env:
          GH_TOKEN: ${{ github.token }}

  lints:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck over composite action scripts, pinact (actions
      # must be SHA-pinned with a matching version comment) and zizmor
      - uses: argumentcomputer/ci-workflows/.github/actions/lint-workflows@main
